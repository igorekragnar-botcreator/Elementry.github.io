<title>English Vocabulary Trainer — Units 1–15</title>
<style>

.word{font-size:34px;font-weight:800;text-align:center;margin:30px 0 8px}.meaning{text-align:center;color:#68738a}.feedback{min-height:25px;text-align:center;font-weight:700;margin-top:12px}.result{text-align:center;font-size:22px}

</style></head><body><div class="app">
<h1>📚 English Vocabulary Trainer</h1><div class="sub">4000 Essential English Words • Units 1–15</div>
<div id="home" class="card"><h2>Выбери Unit</h2>
<div style="margin-bottom:12px;display:grid;grid-template-columns:1fr;gap:8px">
<button onclick="showCombinedWords([1,2,3,4,5])" style="background:#16a34a">⭐ Общий опрос Units 1–5<br><small>100 слов вперемешку</small></button>
<button onclick="showCombinedWords([5,6,7,8,9,10])" style="background:#0d9488">⭐ Общий опрос Units 5–10<br><small>120 слов вперемешку</small></button>

</div>
<div id="units" class="grid"></div></div>
<div id="view" class="card hidden"><h2 id="viewTitle"></h2><div id="wordList" class="words"></div><button onclick="startFromView()">📝 Начать опрос</button><button class="secondary" onclick="goHome()">← К Units</button></div>

<div id="result" class="card hidden"><h2>🎉 Тест закончен!</h2><div id="resultText" class="result"></div><button onclick="retryQuiz()">🔄 Пройти ещё раз</button><button class="secondary" onclick="goHome()">Выбрать Unit</button></div>
</div>

", "серьёзный"], ["spend", "тратить, проводить"], ["strange", "странный"], ["truth", "правда"], ["wake", "просыпаться, будить"]], "12": [["alone", "один, в одиночестве"], ["apartment", "квартира"], ["article", "статья"], ["artist", "художник"], ["altitude", "высота над уровнем моря"], ["compare", "сравнивать"], ["judge", "судья, судить"], ["magazine", "журнал"], ["material", "материал"], ["meal", "приём пищи"], ["method", "метод"], ["neighbor", "сосед"], ["professional", "профессиональный"], ["profit", "прибыль"], ["quality", "качество"], ["shape", "форма, придавать форму"], ["space", "пространство"], ["stair", "ступенька, лестница"], ["symbol", "символ"], ["thin", "тонкий"]], "13": [["blood", "кровь"], ["burn", "гореть, ожог"], ["cell", "клетка"], ["contain", "содержать"], ["correct", "правильный, исправлять"], ["crop", "урожай, выращивать"], ["demand", "требовать, спрос"], ["equal", "равный"], ["feed", "кормить"], ["hole", "дыра"], ["increase", "увеличивать, увеличение"], ["lord", "лорд, господин"], ["owe", "быть должным"], ["position", "позиция, положение"], ["raise", "поднимать, повышать"], ["responsible", "ответственный"], ["sight", "зрение, вид"], ["spot", "место, пятно"], ["structure", "структура"], ["whole", "целый"]], "14": [["coach", "тренер"], ["control", "контроль, контролировать"], ["description", "описание"], ["direct", "прямой, направлять"], ["exam", "экзамен"], ["example", "пример"], ["limit", "предел, ограничивать"], ["local", "местный"], ["magical", "волшебный"], ["mail", "почта"], ["novel", "роман"], ["outline", "план, контур"], ["poet", "поэт"], ["print", "печатать, печать"], ["scene", "сцена"], ["sheet", "лист"], ["silly", "глупый"], ["store", "магазин, хранить"], ["suffer", "страдать"], ["technology", "технология"]], "15": [["across", "через, поперёк"], ["breathe", "дышать"], ["characteristic", "характеристика, характерный"], ["consume", "потреблять"], ["excite", "волновать"], ["extreme", "крайний, экстремальный"], ["fear", "страх, бояться"], ["fortunate", "удачливый"], ["happen", "происходить"], ["length", "длина"], ["mistake", "ошибка"], ["observe", "наблюдать"], ["opportunity", "возможность"], ["price", "цена"], ["race", "гонка, соревноваться"], ["realize", "осознавать"], ["respond", "отвечать, реагировать"], ["risk", "риск, рисковать"], ["wonder", "удивляться, интересоваться"], ["yet", "ещё, пока"]]};let currentUnit=1,list=[],i=0,correct=0,answered=false,isCombined=false,combinedUnits=[];
const $=x=>document.getElementById(x);
function init(){let s='';for(let u=1;u<=15;u++)s+=`<button onclick="showWords(${u})">Unit ${u}<br><small>20 слов</small></button>`;$('units').innerHTML=s}
function hideAll(){['home','view','quiz','result'].forEach(x=>$(x).classList.add('hidden'))}
function goHome(){hideAll();$('home').classList.remove('hidden')}
function wordCard(x){return `<div class="w"><b>${x[0]}</b>${x[1]}<button class="spk" onclick="speak('${x[0]}')" title="Произношение">🔊</button></div>`}
function speak(w){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=0.9;speechSynthesis.speak(u)}
function showWords(u){currentUnit=u;isCombined=false;hideAll();$('view').classList.remove('hidden');$('viewTitle').textContent=`Unit ${u} — 20 слов`;$('wordList').innerHTML=units[u].map(wordCard).join('')}
function showCombinedWords(unitNums){isCombined=true;combinedUnits=unitNums;list=[];unitNums.forEach(u=>{list=list.concat(units[u])});hideAll();$('view').classList.remove('hidden');$('viewTitle').textContent=`Units ${unitNums[0]}–${unitNums[unitNums.length-1]} — ${list.length} слов`;$('wordList').innerHTML=list.map(wordCard).join('')}
function startFromView(){if(isCombined)startCombinedQuiz(combinedUnits);else startQuiz(currentUnit)}
function startQuiz(u){currentUnit=u;isCombined=false;list=[...units[u]].sort(()=>Math.random()-.5);i=0;correct=0;hideAll();$('quiz').classList.remove('hidden');show()}
function startCombinedQuiz(unitNums){isCombined=true;combinedUnits=unitNums;list=[];unitNums.forEach(u=>{list=list.concat(units[u])});list=list.sort(()=>Math.random()-.5);i=0;correct=0;hideAll();$('quiz').classList.remove('hidden');show()}
function show(){answered=false;$('answer').value='';$('feedback').textContent='';$('word').textContent=list[i][1];$('counter').textContent=`${i+1} / ${list.length}`;$('score').textContent=`✅ ${correct}`;$('bar').style.width=(i/list.length*100)+'%';$('answer').focus()}
function check(){if(answered)return;let a=$('answer').value.trim().toLowerCase(),t=list[i][0].toLowerCase();if(a===t){correct++;$('feedback').textContent='✅ Правильно!'}else $('feedback').textContent=`❌ Правильный ответ: ${list[i][0]}`;answered=true;$('score').textContent=`✅ ${correct}`}
function next(){if(!answered){$('feedback').textContent='Сначала проверь ответ.';return}i++;if(i>=list.length){hideAll();$('result').classList.remove('hidden');let title=isCombined?`Units ${combinedUnits[0]}–${combinedUnits[combinedUnits.length-1]}`:`Unit ${currentUnit}`;$('resultText').innerHTML=`${title}<br><b>${correct} / ${list.length}</b><br><small>${Math.round(correct/list.length*100)}%</small>`}else show()}
function retryQuiz(){if(isCombined)startCombinedQuiz(combinedUnits);else startQuiz(currentUnit)}
$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()});init();
</script></body></html>
